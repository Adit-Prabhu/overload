[project]
name = "overload"
version = "0.1.0"
description = "Top-down shooter where you steal and fuse enemy powers against a rival that adapts to how you fight."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pygame-ce==2.5.8",
]

[project.scripts]
overload = "overload.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
# Asset tools (contact sheet color-vision simulation, the audio synth). Not needed to play or
# test. soundfile only encodes the rendered OGG files.
tools = [
    "numpy==2.5.4; python_version >= '3.12'",
    "soundfile==0.13.1; python_version >= '3.12'",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["worker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
